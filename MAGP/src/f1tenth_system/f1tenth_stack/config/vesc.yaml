/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # measured 2026-11-08: three taped 2.00 m drives read 1.859 / 1.880 / 1.922 m on odometry
    # at 4614 (LiDAR 2.04 / 1.98 / 2.01 m): 4614 * mean / 2.00 = 4353, spread about 1.7%
    speed_to_erpm_gain: 4353.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    # measured 2026-11-08 against the VESC IMU gyro: the wheels turned about 25% more than
    # -1.2135 assumed, so odom yaw lagged in corners and steering overshot. Two circle runs
    # (49 and 93 steady windows) fit -0.983 / -0.984 with offset 0.504
    steering_angle_to_servo_gain: -0.98
    # stock 0.5304 drifted slightly right, 0.4697 slightly left -> midpoint (2026-11-01)
    # 2026-11-08: both circle fits and three straight drives put straight ahead at 0.504
    steering_angle_to_servo_offset: 0.504

    # |speed| below this (m/s) -> brake current instead of speed control (0 disables)
    brake_below_speed: 0.3
    stop_brake_current: 20.0   # 10 A was too weak, the car coasted (2026-11-01)

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -100000.0
    # ROS-side cap lifted (2026-11-09): the VESC firmware's max ERPM is the limit now.
    # The car's speed is capped by the panel max_speed and the CSV speeds
    speed_max: 100000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    # yaw rate from the VESC IMU gyro instead (2026-11-08): above 2 m/s tyre slip and servo lag
    # made the servo estimate turn 38% too much in corners; replaying a 3 m/s run, the total
    # turn error went from +9.4% to -1.4%. The servo estimate stays as fallback without IMU.
    use_imu_for_yaw: true
    imu_gyro_bias: 2.44        # [deg/s] start value; re-estimated whenever the car stands still
    # gyro reads about 1.3% low: hand turns of exactly 360 deg gave 357.0, 356.2 and -354.3 deg
    # (2026-11-11). pi/180 (deg/s -> rad/s) x 1.0133
    imu_gyro_scale: 0.017686
    # measured 2026-11-03 (stock config said 25 cm)
    wheelbase: 0.33

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec