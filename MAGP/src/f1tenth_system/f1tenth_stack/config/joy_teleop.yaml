joy:
  ros__parameters:
    # f710_xinput: stick X inside the deadzone is straight, at steer_full it is full lock
    steer_deadzone: 0.08
    steer_full: 0.92
    silence_timeout: 1.0

joy_teleop:
  ros__parameters:
    default:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 0.0
          offset: 0.0
        drive-steering_angle:
          axis: 2
          scale: 0.0
          offset: 0.0

    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [5]  # RB
      axis_mappings:
        drive-speed:
          axis: 4  # RT
          scale: 1.25
          offset: 0.0
        drive-steering_angle:
          axis: 0  # left stick X
          scale: 0.34
          offset: 0.0

    autonomous_control:
      type: topic
      interface_type: std_msgs/msg/Int8
      topic_name: /dev/null
      deadman_buttons: [4]  # LB
      message_value:
        data:
          value: 0
