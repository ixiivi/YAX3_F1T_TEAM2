joy:
  ros__parameters:
    # f710_xinput: stick X inside the deadzone is straight, at steer_full it is full lock
    steer_deadzone: 0.08
    steer_full: 0.92
    # 0 = off: the pad is silent while held still, and the receiver itself reports
    # everything released when the pad loses power (see f710_xinput.step)
    silence_timeout: 0.0
    # trigger travel ignored, then the slowest speed asked for, as a share of the full speed
    # (x drive-speed scale below: 0.4 x 1.25 = 0.5 m/s, the cogging limit of the motor)
    throttle_deadzone: 0.05
    throttle_min: 0.4

joy_teleop:
  ros__parameters:
    default:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 0.0
          offset: 0.0
        drive-steering_angle:
          axis: 2
          scale: 0.0
          offset: 0.0

    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [5]  # RB
      axis_mappings:
        drive-speed:
          axis: 6  # RT forward, LT backward (f710_xinput: RT - LT)
          scale: 1.25
          offset: 0.0
        drive-steering_angle:
          axis: 0  # left stick X
          scale: 0.34
          offset: 0.0

    autonomous_control:
      type: topic
      interface_type: std_msgs/msg/Int8
      topic_name: /dev/null
      deadman_buttons: [4]  # LB
      message_value:
        data:
          value: 0
